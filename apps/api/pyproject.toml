[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixgym"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pixgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pixgym/seed/*_data.py" = ["E501"]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
# Tabele danych trzymamy w zwięzłym formacie: jeden wpis na linię.
exclude = ["src/pixgym/seed/*_data.py"]
